<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZySell | Créer un compte</title>
    <meta name="description" content="Créez votre compte ZySell et commencez à acheter ou vendre des produits numériques.">

    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            background:
                radial-gradient(circle at 50% 0%, rgba(37,115,255,.10), transparent 38%),
                #fff;
        }

        .auth-shell { width: min(100%, 480px); }

        .auth-top { text-align: center; margin-bottom: 26px; }

        .auth-logo {
            width: 74px;
            height: 74px;
            object-fit: contain;
            display: block;
            margin: 0 auto 18px;
        }

        .auth-brand {
            margin: 0 0 10px;
            color: #1976ff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .auth-title {
            margin: 0;
            color: #101114;
            font-size: clamp(32px, 7vw, 46px);
            line-height: 1.02;
            letter-spacing: -.045em;
            font-weight: 850;
        }

        .auth-subtitle {
            max-width: 410px;
            margin: 14px auto 0;
            color: #737780;
            font-size: 15px;
            line-height: 1.65;
        }

        .auth-card {
            padding: 28px;
            background: rgba(255,255,255,.94);
            border: 1px solid #e7e8ec;
            border-radius: 26px;
            box-shadow: 0 22px 70px rgba(16,17,20,.10);
            backdrop-filter: blur(14px);
        }

        .auth-form { display: grid; gap: 16px; }

        .field { display: grid; gap: 8px; }

        .field label {
            color: #24262b;
            font-size: 13px;
            font-weight: 750;
        }

        .field input {
            width: 100%;
            min-height: 54px;
            box-sizing: border-box;
            padding: 0 16px;
            border: 1px solid #dfe1e6;
            border-radius: 14px;
            background: #fff;
            color: #111318;
            font: inherit;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .field input:focus {
            border-color: #1976ff;
            box-shadow: 0 0 0 4px rgba(25,118,255,.10);
        }

        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 54px; }

        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            width: 40px;
            height: 40px;
            transform: translateY(-50%);
            border: 0;
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            color: #737780;
            font-size: 12px;
            line-height: 1.55;
        }

        .terms input {
            margin-top: 3px;
            accent-color: #1976ff;
        }

        .terms a {
            color: #1976ff;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-submit,
        .google-btn {
            width: 100%;
            min-height: 54px;
            border-radius: 14px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: transform .15s, opacity .2s;
        }

        .auth-submit {
            border: 0;
            background: #0d0e11;
            color: #fff;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            border: 1px solid #dfe1e6;
            background: #fff;
            color: #16171a;
        }

        .auth-submit:hover,
        .google-btn:hover {
            transform: translateY(-1px);
        }

        .auth-submit:disabled,
        .google-btn:disabled {
            opacity: .55;
            cursor: wait;
            transform: none;
        }

        .google-icon { width: 19px; height: 19px; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #a0a3aa;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #e7e8ec;
        }

        .message {
            display: none;
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.show { display: block; }

        .message.error {
            color: #a51d2d;
            background: #fff0f2;
            border: 1px solid #ffd0d6;
        }

        .message.success {
            color: #166534;
            background: #effdf4;
            border: 1px solid #bbf7d0;
        }

        .auth-footer,
        .auth-back {
            text-align: center;
            font-size: 13px;
        }

        .auth-footer {
            margin-top: 22px;
            color: #777b83;
            font-size: 14px;
        }

        .auth-footer a {
            color: #1976ff;
            font-weight: 800;
            text-decoration: none;
        }

        .auth-back {
            display: block;
            margin-top: 18px;
            color: #777b83;
            text-decoration: none;
        }

        .auth-back:hover,
        .auth-footer a:hover {
            color: #1976ff;
        }

        body.dark .auth-page {
            background:
                radial-gradient(circle at 50% 0%, rgba(37,115,255,.14), transparent 38%),
                #07090d;
        }

        body.dark .auth-title { color: #f7f8fa; }

        body.dark .auth-subtitle,
        body.dark .auth-footer,
        body.dark .auth-back,
        body.dark .terms { color: #a5aab4; }

        body.dark .auth-card {
            background: rgba(15,17,22,.94);
            border-color: #282c34;
            box-shadow: 0 24px 80px rgba(0,0,0,.30);
        }

        body.dark .field label { color: #e8eaf0; }

        body.dark .field input {
            background: #0b0d12;
            border-color: #30343d;
            color: #f7f8fa;
        }

        body.dark .google-btn {
            background: #11141a;
            border-color: #30343d;
            color: #f7f8fa;
        }

        body.dark .divider::before,
        body.dark .divider::after { background: #30343d; }

        @media (max-width: 520px) {
            .auth-page { padding: 22px 16px; }
            .auth-card { padding: 22px 18px; border-radius: 22px; }
            .auth-title { font-size: 36px; }
        }
    </style>
</head>

<body>
    <main class="auth-page">
        <section class="auth-shell" aria-labelledby="signupTitle">

            <div class="auth-top">
                <img class="auth-logo" src="assets/logo.png" alt="ZySell">
                <p class="auth-brand">ZySell</p>

                <h1 id="signupTitle"
                    class="auth-title"
                    data-fr="Créez votre compte."
                    data-en="Create your account.">
                    Créez votre compte.
                </h1>

                <p class="auth-subtitle"
                   data-fr="Créez votre compte ZySell en quelques secondes. Vous pourrez créer votre boutique plus tard."
                   data-en="Create your ZySell account in seconds. You can create your store later.">
                    Créez votre compte ZySell en quelques secondes. Vous pourrez créer votre boutique plus tard.
                </p>
            </div>

            <div class="auth-card">
                <div id="authMessage" class="message" role="alert"></div>

                <form id="signupForm" class="auth-form">

                    <div class="field">
                        <label for="email"
                               data-fr="Adresse e-mail"
                               data-en="Email address">
                            Adresse e-mail
                        </label>
                        <input id="email" name="email" type="email"
                               autocomplete="email" required
                               placeholder="vous@exemple.com">
                    </div>

                    <div class="field">
                        <label for="password"
                               data-fr="Mot de passe"
                               data-en="Password">
                            Mot de passe
                        </label>
                        <div class="password-wrap">
                            <input id="password" name="password"
                                   type="password"
                                   autocomplete="new-password"
                                   required minlength="6"
                                   placeholder="Au moins 6 caractères">
                            <button type="button"
                                    id="passwordToggle"
                                    class="password-toggle"
                                    aria-label="Afficher le mot de passe">
                                ◉
                            </button>
                        </div>
                    </div>

                    <div class="field">
                        <label for="confirmPassword"
                               data-fr="Confirmer le mot de passe"
                               data-en="Confirm password">
                            Confirmer le mot de passe
                        </label>
                        <div class="password-wrap">
                            <input id="confirmPassword"
                                   name="confirmPassword"
                                   type="password"
                                   autocomplete="new-password"
                                   required minlength="6"
                                   placeholder="Répétez votre mot de passe">
                            <button type="button"
                                    id="confirmPasswordToggle"
                                    class="password-toggle"
                                    aria-label="Afficher le mot de passe">
                                ◉
                            </button>
                        </div>
                    </div>

                    <label class="terms">
                        <input id="acceptTerms" type="checkbox" required>
                        <span>
                            <span data-fr="J'accepte les "
                                  data-en="I agree to the ">
                                J'accepte les
                            </span>
                            <a href="terms.html"
                               data-fr="Conditions d'utilisation"
                               data-en="Terms of use">
                                Conditions d'utilisation
                            </a>
                            <span data-fr=" et la "
                                  data-en=" and ">
                                et la
                            </span>
                            <a href="privacy.html"
                               data-fr="Politique de confidentialité"
                               data-en="Privacy policy">
                                Politique de confidentialité
                            </a>.
                        </span>
                    </label>

                    <button id="signupButton"
                            class="auth-submit"
                            type="submit"
                            data-fr="Créer mon compte"
                            data-en="Create my account">
                        Créer mon compte
                    </button>
                </form>

                <div class="divider">
                    <span data-fr="ou continuer avec"
                          data-en="or continue with">
                        ou continuer avec
                    </span>
                </div>

                <button id="googleButton" class="google-btn" type="button">
                    <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4" d="M21.35 12.23c0-.79-.07-1.55-.23-2.23H12v4.22h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.38z"/>
                        <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.5z"/>
                        <path fill="#FBBC05" d="M6.54 13.58A5.85 5.85 0 0 1 6.23 12c0-.55.11-1.08.31-1.58V7.89H3.3A9.5 9.5 0 0 0 2.25 12c0 1.53.37 2.98 1.05 4.11l3.24-2.53z"/>
                        <path fill="#EA4335" d="M12 6.39c1.43 0 2.72.49 3.73 1.46l2.8-2.8C16.84 3.47 14.63 2.5 12 2.5A9.74 9.74 0 0 0 3.3 7.89l3.24 2.53C7.31 8.11 9.46 6.39 12 6.39z"/>
                    </svg>
                    <span data-fr="Continuer avec Google"
                          data-en="Continue with Google">
                        Continuer avec Google
                    </span>
                </button>

                <p class="auth-footer">
                    <span data-fr="Vous avez déjà un compte ?"
                          data-en="Already have an account?">
                        Vous avez déjà un compte ?
                    </span>
                    <a href="login.html"
                       data-fr="Se connecter"
                       data-en="Sign in">
                        Se connecter
                    </a>
                </p>
            </div>

            <a class="auth-back" href="index.html"
               data-fr="← Retour à ZySell"
               data-en="← Back to ZySell">
                ← Retour à ZySell
            </a>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            setPersistence,
            browserLocalPersistence,
            createUserWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCN2KKYwu_vTuxQ37O1aJWkQ_v-Dj_wRNs",
            authDomain: "zysell-4dccf.firebaseapp.com",
            projectId: "zysell-4dccf",
            storageBucket: "zysell-4dccf.firebasestorage.app",
            messagingSenderId: "471869632233",
            appId: "1:471869632233:web:fbcef0190964790a434a78",
            measurementId: "G-P19LD5WPCY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        const form = document.getElementById("signupForm");
        const signupButton = document.getElementById("signupButton");
        const googleButton = document.getElementById("googleButton");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const message = document.getElementById("authMessage");

        let currentLanguage = localStorage.getItem("zysell-language") || "fr";

        function t(fr, en) {
            return currentLanguage === "en" ? en : fr;
        }

        function showMessage(type, fr, en) {
            message.className = `message show ${type}`;
            message.textContent = t(fr, en);
        }

        function clearMessage() {
            message.className = "message";
            message.textContent = "";
        }

        function applyPreferences() {
            currentLanguage = localStorage.getItem("zysell-language") || "fr";

            document.documentElement.lang = currentLanguage;

            document.querySelectorAll("[data-fr][data-en]").forEach((element) => {
                element.textContent =
                    currentLanguage === "en"
                        ? element.dataset.en
                        : element.dataset.fr;
            });

            document.body.classList.toggle(
                "dark",
                localStorage.getItem("zysell-theme") === "dark"
            );
        }

        function firebaseError(error) {
            const errors = {
                "auth/email-already-in-use": [
                    "Un compte existe déjà avec cette adresse e-mail.",
                    "An account already exists with this email address."
                ],
                "auth/invalid-email": [
                    "L'adresse e-mail n'est pas valide.",
                    "The email address is not valid."
                ],
                "auth/weak-password": [
                    "Le mot de passe est trop faible.",
                    "The password is too weak."
                ],
                "auth/network-request-failed": [
                    "Problème de connexion Internet.",
                    "Network connection problem."
                ],
                "auth/too-many-requests": [
                    "Trop de tentatives. Réessayez plus tard.",
                    "Too many attempts. Please try again later."
                ]
            };

            return errors[error?.code] || [
                "Impossible de créer le compte pour le moment.",
                "Unable to create the account right now."
            ];
        }

        function setPasswordToggle(button, input) {
            button.addEventListener("click", () => {
                const visible = input.type === "text";
                input.type = visible ? "password" : "text";
                button.textContent = visible ? "◉" : "◌";
            });
        }

        setPasswordToggle(
            document.getElementById("passwordToggle"),
            password
        );

        setPasswordToggle(
            document.getElementById("confirmPasswordToggle"),
            confirmPassword
        );

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            clearMessage();

            const email = document.getElementById("email").value.trim();
            const passwordValue = password.value;
            const confirmValue = confirmPassword.value;
            const accepted = document.getElementById("acceptTerms").checked;

            if (passwordValue !== confirmValue) {
                showMessage(
                    "error",
                    "Les deux mots de passe ne correspondent pas.",
                    "The two passwords do not match."
                );
                return;
            }

            if (!accepted) {
                showMessage(
                    "error",
                    "Vous devez accepter les conditions pour créer un compte.",
                    "You must accept the terms to create an account."
                );
                return;
            }

            try {
                signupButton.disabled = true;
                signupButton.textContent = t(
                    "Création du compte...",
                    "Creating account..."
                );

                await setPersistence(auth, browserLocalPersistence);

                const credential = await createUserWithEmailAndPassword(
                    auth,
                    email,
                    passwordValue
                );

                showMessage(
                    "success",
                    "Compte créé avec succès. Ouverture de votre espace...",
                    "Account created successfully. Opening your workspace..."
                );

                // Vérifie que Firebase a bien conservé la session avant la navigation.
                const goToDashboard = () => {
                    if (auth.currentUser) {
                        window.location.assign("dashboard.html");
                        return;
                    }
                    setTimeout(goToDashboard, 100);
                };

                goToDashboard();

            } catch (error) {
                const [fr, en] = firebaseError(error);
                showMessage("error", fr, en);

                signupButton.disabled = false;
                signupButton.textContent = t(
                    "Créer mon compte",
                    "Create my account"
                );
            }
        });

        googleButton.addEventListener("click", async () => {
            clearMessage();

            try {
                googleButton.disabled = true;

                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, googleProvider);

                showMessage(
                    "success",
                    "Compte Google connecté. Ouverture de votre espace...",
                    "Google account connected. Opening your workspace..."
                );

                window.location.assign("dashboard.html");

            } catch (error) {
                const [fr, en] = firebaseError(error);
                showMessage("error", fr, en);
                googleButton.disabled = false;
            }
        });

        applyPreferences();

        window.addEventListener("storage", applyPreferences);
    </script>
</body>
</html>
