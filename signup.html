<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Créer un compte | Zysell</title>

<meta name="theme-color" content="#4F46E5">

<link rel="icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:'Inter',sans-serif;

}

body{

background:#F8FAFC;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.signup-card{

width:100%;

max-width:500px;

background:#FFFFFF;

padding:35px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.logo{

width:170px;

margin:0 auto 25px;

display:block;

}

h1{

text-align:center;

font-size:30px;

color:#1E293B;

margin-bottom:10px;

}

.subtitle{

text-align:center;

font-size:15px;

color:#64748B;

margin-bottom:30px;

}

.input-group{

margin-bottom:18px;

}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:600;

color:#334155;

}

.input-group input,

.input-group select{

width:100%;

padding:15px;

border:1px solid #CBD5E1;

border-radius:12px;

font-size:15px;

outline:none;

transition:.3s;

}

.input-group input:focus,

.input-group select:focus{

border-color:#4F46E5;

}.password-box{

position:relative;

}

.password-box input{

padding-right:50px;

}

.password-box i{

position:absolute;

top:50%;

right:18px;

transform:translateY(-50%);

cursor:pointer;

color:#64748B;

}

.checkbox{

display:flex;

align-items:flex-start;

gap:10px;

margin:20px 0;

}

.checkbox input{

margin-top:4px;

}

.checkbox label{

font-size:14px;

color:#475569;

line-height:1.6;

}

.checkbox a{

color:#4F46E5;

text-decoration:none;

font-weight:600;

}

.btn{

width:100%;

padding:15px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.3s;

}

.btn-signup{

background:#4F46E5;

color:white;

margin-bottom:15px;

}

.btn-signup:hover{

background:#3730A3;

}

.divider{

display:flex;

align-items:center;

margin:25px 0;

color:#94A3B8;

font-size:14px;

}

.divider::before,

.divider::after{

content:"";

flex:1;

height:1px;

background:#E2E8F0;

}

.divider span{

padding:0 15px;

}

.google-btn{

width:100%;

padding:15px;

border:1px solid #CBD5E1;

background:#FFFFFF;

border-radius:12px;

display:flex;

align-items:center;

justify-content:center;

gap:10px;

font-size:15px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.google-btn:hover{

background:#F8FAFC;

}

.login{

text-align:center;

margin-top:25px;

font-size:15px;

color:#64748B;

}

.login a{

color:#4F46E5;

font-weight:700;

text-decoration:none;

}</style>

</head>

<body>

<div class="signup-card">

<img src="logo.png" alt="Zysell" class="logo">

<h1>Créer un compte</h1>

<p class="subtitle">

Rejoignez Zysell et commencez à vendre ou acheter des produits numériques.

</p>

<form id="signupForm">

<div class="input-group">

<label>Nom complet</label>

<input
type="text"
id="fullname"
placeholder="Entrez votre nom complet"
required>

</div>

<div class="input-group">

<label>Adresse e-mail</label>

<input
type="email"
id="email"
placeholder="Entrez votre adresse e-mail"
required>

</div>

<div class="input-group">

<label>Pays</label>

<select id="country" required>

<option value="">Sélectionnez votre pays</option>

<!-- Tous les pays du monde seront ajoutés
automatiquement par JavaScript -->

</select>

</div>

<div class="input-group">

<label>Mot de passe</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Créez un mot de passe"
required>

<i class="fa-solid fa-eye" id="togglePassword"></i>

</div>

</div>

<div class="input-group">

<label>Confirmer le mot de passe</label>

<div class="password-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirmez votre mot de passe"
required>

<i class="fa-solid fa-eye" id="toggleConfirmPassword"></i>

</div>

</div>

<div class="checkbox">

<input
type="checkbox"
id="terms"
required>

<label for="terms">

J'accepte les <a href="#">Conditions d'utilisation</a> et la <a href="#">Politique de confidentialité</a>.

</label>

</div>

<button
type="submit"
class="btn btn-signup">

Créer un compte

</button>

<div class="divider">

<span>OU</span>

</div>

<button
type="button"
class="google-btn"
id="googleSignup">

<i class="fa-brands fa-google"></i>

Continuer avec Google

</button>

<div class="login">

Vous avez déjà un compte ?

<a href="login.html">

Se connecter

</a>

</div>

</form>

</div><script>

const togglePassword=document.getElementById("togglePassword");

const toggleConfirmPassword=document.getElementById("toggleConfirmPassword");

const password=document.getElementById("password");

const confirmPassword=document.getElementById("confirmPassword");

togglePassword.onclick=()=>{

password.type=password.type==="password"?"text":"password";

togglePassword.classList.toggle("fa-eye");

togglePassword.classList.toggle("fa-eye-slash");

};

toggleConfirmPassword.onclick=()=>{

confirmPassword.type=confirmPassword.type==="password"?"text":"password";

toggleConfirmPassword.classList.toggle("fa-eye");

toggleConfirmPassword.classList.toggle("fa-eye-slash");

};

document.getElementById("signupForm").addEventListener("submit",(e)=>{

e.preventDefault();

if(password.value!==confirmPassword.value){

alert("Les mots de passe ne correspondent pas.");

return;

}

alert("Le formulaire est prêt. L'inscription sera reliée à Firebase dans la prochaine étape.");

});

const countries=[

"Cameroun",

"Bénin",

"Côte d'Ivoire",

"France",

"Canada",

"États-Unis"

];

const select=document.getElementById("country");

countries.sort().forEach(country=>{

const option=document.createElement("option");

option.value=country;

option.textContent=country;

select.appendChild(option);

});

</script>

</body>

</html>
