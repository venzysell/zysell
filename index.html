<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion | Zysell</title>

<meta name="theme-color" content="#4F46E5">

<link rel="icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#F8FAFC;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.login-card{

width:100%;

max-width:430px;

background:#fff;

padding:35px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.logo{

width:170px;

margin:0 auto 25px;

display:block;

}

h1{

text-align:center;

font-size:30px;

margin-bottom:10px;

color:#1E293B;

}

.subtitle{

text-align:center;

color:#64748B;

margin-bottom:30px;

font-size:15px;

}

.input-group{

margin-bottom:18px;

}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:600;

color:#334155;

}

.input-group input{

width:100%;

padding:15px;

border:1px solid #CBD5E1;

border-radius:12px;

font-size:15px;

outline:none;

transition:.3s;

}

.input-group input:focus{

border-color:#4F46E5;

}
