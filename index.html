<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zysell | Créez. Vendez. Encaissez.</title>

<meta name="description" content="Zysell est une plateforme internationale permettant de vendre et d'acheter des produits numériques en toute sécurité.">

<meta name="theme-color" content="#4F46E5">

<link rel="icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

background:#F8FAFC;

color:#1E293B;

overflow-x:hidden;

min-height:100vh;

}

a{
text-decoration:none;
color:inherit;
}

button{

border:none;

outline:none;

cursor:pointer;

font-family:inherit;

}

img{

display:block;

max-width:100%;

}

.container{

width:92%;

max-width:1280px;

margin:auto;

}header{

position:sticky;

top:0;

left:0;

width:100%;

background:#FFFFFF;

box-shadow:0 2px 15px rgba(0,0,0,.06);

z-index:1000;

}

nav{

height:80px;

display:flex;

align-items:center;

justify-content:space-between;

gap:20px;

}

.logo{

height:50px;

cursor:pointer;

}

.nav-right{

display:flex;

align-items:center;

gap:15px;

}

.select-box{

display:flex;

align-items:center;

gap:10px;

padding:10px 15px;

background:#F1F5F9;

border-radius:12px;

}

.select-box i{

color:#4F46E5;

font-size:18px;

}

.select-box select{

border:none;

background:transparent;

outline:none;

font-size:15px;

font-weight:600;

cursor:pointer;

}

.hero{

min-height:calc(100vh - 80px);

display:flex;

align-items:center;

justify-content:center;

text-align:center;

padding:60px 20px;

}

.hero-content{

max-width:760px;

}

.hero-content img{

width:180px;

margin:auto;

margin-bottom:35px;

}

.hero-content h1{

font-size:56px;

font-weight:800;

line-height:1.2;

color:#1E293B;

margin-bottom:20px;

}

.hero-content p{

font-size:20px;

line-height:1.8;

color:#64748B;

margin-bottom:40px;

}

.buttons{

display:flex;

justify-content:center;

gap:18px;

flex-wrap:wrap;

}

.btn{

padding:16px 36px;

border-radius:50px;

font-size:17px;

font-weight:700;

transition:.3s;

}

.btn-primary{

background:#4F46E5;

color:white;

}

.btn-primary:hover{

background:#3730A3;

}

.btn-outline{

border:2px solid #4F46E5;

background:white;

color:#4F46E5;

}

.btn-outline:hover{

background:#4F46E5;

color:white;

}

@media(max-width:768px){

nav{

height:auto;

padding:15px 0;

flex-direction:column;

}

.nav-right{

width:100%;

justify-content:center;

flex-wrap:wrap;

}

.hero-content h1{

font-size:38px;

}

.hero-content p{

font-size:17px;

}

.btn{

width:100%;

}

  }</style>

</head>

<body>

<header>

<div class="container">

<nav>

<a href="index.html">

<img src="logo.png" alt="Zysell" class="logo">

</a>

<div class="nav-right">

<div class="select-box">

<i class="fa-solid fa-language"></i>

<select id="language">

<option value="fr">🇫🇷 Français</option>

<option value="en">🇬🇧 English</option>

</select>

</div>

<div class="select-box">

<i class="fa-solid fa-globe"></i>

<select id="country">

<option value="">🌍 Sélectionner un pays</option>

<!-- Les pays seront ajoutés automatiquement en JavaScript
et classés par ordre alphabétique -->

</select>

</div>

<a href="login.html" class="btn btn-outline">

Se connecter

</a>

<a href="signup.html" class="btn btn-primary">

Créer un compte

</a>

</div>

</nav>

</div>

</header>

<section class="hero">

<div class="container">

<div class="hero-content">

<img src="logo.png" alt="Logo Zysell">

<h1 id="title">

Créez. Vendez. Encaissez.

</h1>

<p id="subtitle">

La plateforme internationale pour acheter et vendre des produits numériques en toute sécurité.

</p>

<div class="buttons">

<a href="signup.html" class="btn btn-primary">

Commencer gratuitement

</a>

<a href="#about" class="btn btn-outline">

Découvrir Zysell

</a>

</div>

</div>

</div>

</section>
