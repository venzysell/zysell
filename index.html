<!DOCTYPE html>
<html lang="fr">

<head>

    <!-- ========================= -->
    <!-- META -->
    <!-- ========================= -->

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZySell | Marketplace de produits numériques</title>

    <meta name="description"
        content="Achetez et vendez des produits numériques partout dans le monde avec ZySell.">

    <meta name="keywords"
        content="Marketplace, Produits numériques, Ebook, Formation, Logiciel, Template, Musique">

    <meta name="author" content="ZySell">
    <meta name="theme-color" content="#4F46E5">

    <!-- Open Graph -->

    <meta property="og:type" content="website">
    <meta property="og:title" content="ZySell | Marketplace de produits numériques">
    <meta property="og:description"
        content="Achetez et vendez facilement des produits numériques partout dans le monde.">
    <meta property="og:image" content="assets/images/cover.jpg">

    <!-- Favicon -->

    <link rel="icon" href="assets/images/favicon.png">

    <!-- ========================= -->
    <!-- GOOGLE FONTS -->
    <!-- ========================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- ========================= -->
    <!-- FONT AWESOME -->
    <!-- ========================= -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ========================= -->
    <!-- STYLES -->
    <!-- ========================= -->

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/animations.css">

</head>

<body><!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<header class="header">

    <div class="container">

        <nav class="navbar">

            <!-- Logo -->

            <a href="index.html" class="logo">

                <img src="logo.png" alt="Logo ZySell">

                <span>ZySell</span>

            </a>

            <!-- Navigation -->

            <ul class="nav-menu">

                <li>
                    <a href="index.html"
                       class="active"
                       data-i18n="home">
                        Accueil
                    </a>
                </li>

                <li>
                    <a href="explore.html"
                       data-i18n="explore">
                        Explorer
                    </a>
                </li>

                <li>
                    <a href="store.html"
                       data-i18n="stores">
                        Boutiques
                    </a>
                </li>

                <li>
                    <a href="pricing.html"
                       data-i18n="pricing">
                        Tarifs
                    </a>
                </li>

                <li>
                    <a href="contact.html"
                       data-i18n="contact">
                        Contact
                    </a>
                </li>

            </ul>

            <!-- Actions -->

            <div class="nav-actions">

                <!-- Recherche -->

                <button class="icon-btn"
                        id="searchBtn"
                        title="Recherche">

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

                <!-- Pays -->

                <button class="icon-btn"
                        id="countryBtn"
                        title="Pays">

                    <span id="countryFlag">🌍</span>

                    <span id="countryCode">
                        CM
                    </span>

                </button>

                <!-- Langue -->

                <div class="language-switcher">

                    <button class="icon-btn active"
                            data-language="fr">

                        FR

                    </button>

                    <button class="icon-btn"
                            data-language="en">

                        EN

                    </button>

                </div>

                <!-- Thème -->

                <button class="icon-btn"
                        id="themeBtn"
                        title="Mode sombre">

                    <i class="fa-solid fa-moon"></i>

                </button>

                <!-- Connexion -->

                <a href="login.html"
                   class="btn btn-outline"
                   data-i18n="login">

                    Se connecter

                </a>

                <!-- Commencer -->

                <a href="signup.html"
                   class="btn btn-primary"
                   data-i18n="start">

                    Commencer

                </a>

            </div>

            <!-- Menu Mobile -->

            <button class="mobile-menu-btn"
                    id="mobileMenuBtn">

                <i class="fa-solid fa-bars"></i>

            </button>

        </nav>

    </div>

</header><!-- ========================= -->
<!-- MENU MOBILE -->
<!-- ========================= -->

<div class="mobile-menu" id="mobileMenu">

    <ul>

        <li>
            <a href="index.html"
               class="active"

            </a>
        </li>

        <li>
            <a href="explore.html"
               data-i18n="explore">

            </a>
        </li>

        <li>

               data-i18n="stores">

            </a>
        </li>

        <li>

               data-i18n="contact">
                Contact
            </a>
        </li>

    </ul>

    <div class="mobile-menu-options">

        <!-- Pays -->

        <button class="mobile-option-btn"
                id="countryBtnMobile">

            <span id="countryFlagMobile">🌍</span>

            <span id="countryCodeMobile">
                CM
            </span>

        </button>

        <!-- Langue -->

        <div class="language-switcher mobile-language">

            <button class="icon-btn active"
                    data-language="fr">
                FR
            </button>

            <button class="icon-btn"
                    data-language="en">
                EN
            </button>

        </div>

        <!-- Thème -->

        <button class="mobile-option-btn"
                id="themeBtnMobile">

            <i class="fa-solid fa-moon"></i>

            <span data-i18n="darkMode">
                Mode sombre
            </span>

        </button>

    </div>

    <div class="mobile-auth">

        <a href="login.html"
           class="btn btn-outline"
           data-i18n="login">
            Se connecter
        </a>

        <a href="signup.html"
           class="btn btn-primary"
           data-i18n="start">
            Commencer
        </a>

    </div>

</div>
