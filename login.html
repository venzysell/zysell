<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion | Zysell</title>

<meta name="theme-color" content="#4F46E5">

<link rel="icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#F8FAFC;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.login-card{

width:100%;

max-width:430px;

background:#fff;

padding:35px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.logo{

width:170px;

margin:0 auto 25px;

display:block;

}

h1{

text-align:center;

font-size:30px;

margin-bottom:10px;

color:#1E293B;

}

.subtitle{

text-align:center;

color:#64748B;

margin-bottom:30px;

font-size:15px;

}

.input-group{

margin-bottom:18px;

}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:600;

color:#334155;

}

.input-group input{

width:100%;

padding:15px;

border:1px solid #CBD5E1;

border-radius:12px;

font-size:15px;

outline:none;

transition:.3s;

}

.input-group input:focus{

border-color:#4F46E5;

}.password-box{

position:relative;

}

.password-box input{

padding-right:50px;

}

.password-box i{

position:absolute;

right:18px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

color:#64748B;

}

.forgot{

text-align:right;

margin-top:-8px;

margin-bottom:20px;

}

.forgot a{

text-decoration:none;

font-size:14px;

color:#4F46E5;

font-weight:600;

}

.btn{

width:100%;

padding:15px;

border:none;

border-radius:12px;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.3s;

}

.btn-login{

background:#4F46E5;

color:white;

margin-bottom:15px;

}

.btn-login:hover{

background:#3730A3;

}

.divider{

display:flex;

align-items:center;

margin:25px 0;

color:#94A3B8;

font-size:14px;

}

.divider::before,

.divider::after{

content:"";

flex:1;

height:1px;

background:#E2E8F0;

}

.divider span{

padding:0 15px;

}

.google-btn{

width:100%;

padding:15px;

border:1px solid #CBD5E1;

background:white;

border-radius:12px;

font-weight:600;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;

gap:10px;

transition:.3s;

}

.google-btn:hover{

background:#F8FAFC;

}

.signup{

text-align:center;

margin-top:25px;

font-size:15px;

color:#64748B;

}

.signup a{

color:#4F46E5;

font-weight:700;

text-decoration:none;

}</style>

</head>

<body>

<div class="login-card">

<img src="logo.png" alt="Zysell" class="logo">

<h1>Connexion</h1>

<p class="subtitle">

Connectez-vous à votre compte Zysell.

</p>

<form id="loginForm">

<div class="input-group">

<label>Adresse e-mail</label>

<input
type="email"
id="email"
placeholder="Entrez votre adresse e-mail"
required>

</div>

<div class="input-group">

<label>Mot de passe</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Entrez votre mot de passe"
required>

<i class="fa-solid fa-eye" id="togglePassword"></i>

</div>

</div>

<div class="forgot">

<a href="forgot-password.html">

Mot de passe oublié ?

</a>

</div>

<button
type="submit"
class="btn btn-login">

Se connecter

</button>

<div class="divider">

<span>OU</span>

</div>

<button
type="button"
class="google-btn"
id="googleLogin">

<i class="fa-brands fa-google"></i>

Continuer avec Google

</button>

<div class="signup">

Vous n'avez pas de compte ?

<a href="signup.html">

Créer un compte

</a>

</div>

</form>

</div><script type="module">

import{

loginUser,

loginWithGoogle

}from"./firebase.js";

const form=document.getElementById("loginForm");

const email=document.getElementById("email");

const password=document.getElementById("password");

const toggle=document.getElementById("togglePassword");

toggle.addEventListener("click",()=>{

if(password.type==="password"){

password.type="text";

toggle.classList.replace("fa-eye","fa-eye-slash");

}else{

password.type="password";

toggle.classList.replace("fa-eye-slash","fa-eye");

}

});

form.addEventListener("submit",async(e)=>{

e.preventDefault();

try{

await loginUser(

email.value.trim(),

password.value

);

window.location.href="dashboard.html";

}catch(error){

alert(error.message);

}

});

document.getElementById("googleLogin").addEventListener("click",async()=>{

try{

await loginWithGoogle();

window.location.href="dashboard.html";

}catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
